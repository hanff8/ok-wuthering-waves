name: Windows Release
run-name: Windows release · ${{ github.ref_name }}

# fork 版发布流水线：测试 → 构建未签名安装包 → 发布到本仓库 Releases。
# 与上游 ok-oldking/ok-wuthering-waves 的 build.yml 相比，去掉了 fork 里不可能工作的部分：
#   1. synchronize job：上游用 CNB_TOKEN / OK_GH 把代码同步到 ok-oldking 的更新仓库（cnb.cool、ok-ww-update）
#   2. SignPath 代码签名：证书与组织属于上游，fork 没有 SIGNPATH_API_TOKEN
#   3. publish 末尾触发 MirrorChyan 分发工作流
# 因此产物是未签名安装包；应用内自动更新仍指向上游更新仓库（pyappify.yml 的 git_url），
# 若要让更新只跟随本 fork，需要另建更新仓库并恢复同步 job。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'
  BUILD_EXE: 'true'

jobs:
  validate:
    name: 1 · Validate
    runs-on: windows-latest

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "hanff8@users.noreply.github.com"
          git config --global user.name "hanff8"

      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: true
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ".[dev]"

      - name: Run tests
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          CNB_TOKEN: ''
          OK_GH: ''
          SIGNPATH_API_TOKEN: ''
          GEMINI_API_KEY: ''
          AI_API_KEY: ''
          MirrorChyanUploadToken: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: |
          @(
            'GITHUB_TOKEN',
            'GH_TOKEN',
            'CNB_TOKEN',
            'OK_GH',
            'SIGNPATH_API_TOKEN',
            'GEMINI_API_KEY',
            'AI_API_KEY',
            'MirrorChyanUploadToken',
            'ACTIONS_RUNTIME_TOKEN',
            'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
          ) | ForEach-Object {
            Remove-Item "Env:\$_" -ErrorAction SilentlyContinue
          }

          Get-ChildItem -Path ".\tests\*.py" | ForEach-Object {
            Write-Host "Running tests in $($_.FullName)"
            python -u run_test.py $_.FullName

            if ($LASTEXITCODE -ne 0) {
              throw "Tests failed in $($_.FullName)"
            }
          }

  package:
    name: 2 · Build installers
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "hanff8@users.noreply.github.com"
          git config --global user.name "hanff8"

      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: true
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ".[dev]"

      # 把 ok / pyappify 内联进仓库，并把 config.py 的版本号写成 tag 号；
      # workflow_dispatch（非 tag）时保持仓库自带版本号。
      - name: Prepare release requirements
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Build portable executable and installers
        id: build_executable
        uses: ok-oldking/pyappify-action@master

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        if: env.BUILD_EXE == 'true'
        with:
          name: release-assets
          path: pyappify_dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 3 · Publish release
    needs: [ validate, package ]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine version type
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build changelog
        id: changelog
        shell: bash
        run: |
          current="$GITHUB_REF_NAME"
          previous=$(git describe --tags --abbrev=0 "${current}^" 2>/dev/null || true)
          if [ -z "$previous" ]; then
            range="$current"
          else
            range="$previous..$current"
          fi
          # 不要用 `git log | head`：runner 的 bash 开了 pipefail，head 提前关管道会让
          # git log 以 SIGPIPE(141) 退出，整个 step 失败并截断下面的 heredoc。
          changes=$(git log --no-merges --max-count=50 --pretty=format:'- %s (%h)' "$range")
          {
            echo "changes<<EOF"
            printf '%s\n' "$changes"
            echo "EOF"
            echo "previous=$previous"
            echo "range=$range"
          } >> "$GITHUB_OUTPUT"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: pyappify_dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            ### 更新日志 ${{ steps.changelog.outputs.range }}:
              ${{ steps.changelog.outputs.changes }}
            ### 下载包说明
              * [ok-ww-win32-China-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ok-ww-win32-China-setup.exe) 完整安装包, 更新使用阿里云+腾讯CNB.
              * [ok-ww-win32-Global-setup.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ok-ww-win32-Global-setup.exe) full package with dependencies, using GitHub and PyPi as update source
              * 不要下载 ok-ww-win32.zip 和 SourceCode.zip, Do Not Download the SourceCode, ok-ww-win32.zip
            ### 说明
              * 这是 fork (hanff8/ok-wuthering-waves) 的自动构建产物，**未做代码签名**，首次运行可能触发 SmartScreen 提示。
              * 应用内自动更新仍指向上游更新仓库；如需更新只跟随本 fork，请另建更新仓库并配置同步。
          draft: false
          prerelease: ${{ steps.version.outputs.is_release != 'true' }}
          files: pyappify_dist/*